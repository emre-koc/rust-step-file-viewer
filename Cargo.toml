[workspace]
resolver = "3"
members = [
    "crates/step-p21",
    "crates/step-model",
    "crates/step-brep",
    "crates/step-mesh",
    "crates/step-cache",
    "crates/step-export",
    "crates/step-render",
    "crates/step-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
# parsing
memmap2 = "0.9.11"
memchr = "2.8.3"
fast-float2 = "0.2.4"
phf = { version = "0.13", features = ["macros"] }
bumpalo = { version = "3.20.3", features = ["collections"] }
rayon = "1.12.0"
rustc-hash = "2"
smallvec = { version = "1", features = ["union", "const_generics"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# geometry
glam = { version = "0.33.7", features = ["bytemuck", "serde"] }
spade = "2.15.1"
i_triangle = "0.48.0"
earcutr = "0.5.0"
# cache / io
blake3 = { version = "1", features = ["rayon"] }
zerocopy = { version = "0.8", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# gpu / ui
wgpu = "=30.0.1"
winit = "=0.30.13"
egui = "=0.36.1"
egui-wgpu = "=0.36.1"
egui-winit = "=0.36.1"
eframe = { version = "=0.36.1", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
rfd = "0.17.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
# cli
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# dev
insta = { version = "1", features = ["json"] }
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

# internal
step-p21 = { path = "crates/step-p21" }
step-model = { path = "crates/step-model" }
step-brep = { path = "crates/step-brep" }
step-mesh = { path = "crates/step-mesh" }
step-cache = { path = "crates/step-cache" }
step-export = { path = "crates/step-export" }
step-render = { path = "crates/step-render" }

[package]
name = "stepview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Fast native STEP (ISO 10303-21) viewer for macOS on Apple Silicon"
default-run = "stepview"

[[bin]]
name = "stepview"
path = "src/main.rs"

[dependencies]
step-p21.workspace = true
step-model.workspace = true
step-brep.workspace = true
step-mesh.workspace = true
step-export.workspace = true
step-cache.workspace = true
step-render.workspace = true
glam.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
rfd.workspace = true
image.workspace = true
pollster.workspace = true
dirs.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSURL", "NSString", "NSNotification", "NSEnumerator", "NSObjCRuntime", "NSThread"] }

[dev-dependencies]
insta.workspace = true

[package.metadata.packager]
productName = "StepView"
identifier = "com.dresden.stepview"
description = "Fast native STEP viewer"
longDescription = "Opens STEP (ISO 10303-21) CAD files in about a second on Apple Silicon. Pure Rust, Metal rendering."
authors = ["Dresden Vision"]
publisher = "Dresden Vision"
copyright = "2026 Dresden Vision"
category = "Utility"
icons = ["macos/AppIcon.icns"]
formats = ["app"]
outDir = "build/dist"
fileAssociations = [
    { extensions = ["step", "stp", "p21"], mimeType = "model/step", name = "STEP CAD File", description = "STEP CAD File (ISO 10303-21)", role = "viewer" },
]

[package.metadata.packager.macos]
minimumSystemVersion = "13.0"
infoPlistPath = "macos/Info.plist"
signingIdentity = "-"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
